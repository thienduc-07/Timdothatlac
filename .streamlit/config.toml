[server]
enableStaticServing = true
headless = true
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 200

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#00F0FF"
backgroundColor = "#050811"
secondaryBackgroundColor = "#0C1222"
textColor = "#F8FAFC"
font = "sans serif"

